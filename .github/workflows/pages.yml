# Publishes app/ to GitHub Pages. Nothing is published until Pages is enabled for the repository
# (Settings > Pages > Source: GitHub Actions); private repositories need a plan that allows Pages.
name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (no test or export tools)
        run: |
          mkdir _site
          rsync -a --exclude tools --exclude .gitignore --exclude README.md app/ _site/
          touch _site/.nojekyll
          du -sh _site; find _site -size +95M -print
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
